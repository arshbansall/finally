# Optional convenience wrapper around the single FinAlly container.
#   docker compose up -d --build     # build + start on http://localhost:8000
#   docker compose down              # stop (data volume is kept)

services:
  finally:
    build: .
    image: finally
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - finally-data:/app/db
    restart: unless-stopped

volumes:
  finally-data:
    name: finally-data
