[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly AI trading workstation backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "litellm>=1.106.4",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
